<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocab Quest</title>
  <meta name="description" content="ゲーム・まんが・アニメのカタカナ語から英単語を学ぶRPG">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗝️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">VOCAB<span>QUEST</span></div>
    <div class="player">
      <span class="lv" id="hud-level">Lv 1</span>
      <div class="xpbar" aria-label="経験値"><div id="hud-xp"></div></div>
      <span id="hud-gold">💰0G</span>
      <span id="hud-streak" title="連続プレイ日数">🔥0</span>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="map" class="active"><span>🗺</span>マップ</button>
    <button data-tab="dex"><span>📖</span>ことばの書</button>
    <button data-tab="roots"><span>💎</span>語根の宝珠</button>
    <button data-tab="status"><span>🛡️</span>つよさ</button>
  </nav>

  <div class="modal" id="modal" hidden>
    <div class="modal-body" role="dialog" aria-modal="true">
      <button class="close" id="modal-close" aria-label="閉じる">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="app/app.js"></script>
</body>
</html>
