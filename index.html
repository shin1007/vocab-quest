<!doctype html>
<html lang="ja" data-theme="stage">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef4ff">
  <title>KATAkaNA BUILDER</title>
  <meta name="description" content="身の回りのカタカナ語から英単語を学ぶ">
  <!-- SNS のリンクカード（画像は scripts/ogp/render.mjs で作る）。og:image は絶対 URL でないと表示されない -->
  <meta property="og:title" content="KATAkaNA BUILDER">
  <meta property="og:description" content="身の回りのカタカナ語から英単語を学ぶ">
  <meta property="og:url" content="https://vocab-quest-lyart.vercel.app/">
  <meta property="og:site_name" content="KATAkaNA BUILDER">
  <meta property="og:image" content="https://vocab-quest-lyart.vercel.app/icons/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="KATAkaNA BUILDER — 身の回りのカタカナ語から英単語を学ぶ">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗡️</text></svg>">
  <script>
    // 保存済みのテーマを描画前に当てる（ちらつき防止）。テーマの一覧は app.js の THEMES
    try {
      const t = JSON.parse(localStorage.getItem("vocab-quest-save-v3") || "{}").settings?.theme;
      if (["stage", "pop", "street", "noble", "wa"].includes(t)) document.documentElement.dataset.theme = t;
    } catch { /* 保存データが読めなければ既定のテーマ */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Montserrat:ital,wght@0,700;0,800;1,800;1,900&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="KATAkaNA BUILDER"><span class="blade">KATA<small>ka</small>NA</span><span class="sub">BUILDER</span></div>
    <div class="hud">
      <span class="pill" id="hud-streak" title="連続学習日数">🔥 0</span>
      <span class="pill" id="hud-learned" title="定着した単語">📘 0</span>
      <button class="pill" id="theme-btn" aria-label="テーマを変える">🎨</button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="home" class="active"><span>🏠</span>ホーム</button>
    <button data-tab="dex"><span>📖</span>単語帳</button>
    <button data-tab="pairs"><span>👯</span>似た語</button>
    <button data-tab="roots"><span>🧩</span>語根</button>
    <button data-tab="stats"><span>📊</span>記録</button>
  </nav>

  <div class="modal" id="modal" hidden>
    <div class="modal-body" role="dialog" aria-modal="true">
      <button class="close" id="modal-close" aria-label="閉じる">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="app/app.js"></script>
</body>
</html>
