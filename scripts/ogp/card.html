<!doctype html>
<!-- SNS のリンクカード用画像（icons/ogp.png, 1200×630）の元。render.mjs で PNG にする。既定のテーマ「和」の見た目 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px;
    font-family: "Zen Kaku Gothic New", sans-serif; color: #f2ebdd;
    background:
      linear-gradient(158deg, transparent calc(47% - 1px), rgba(255, 236, 214, .6) 47%, transparent calc(47% + 2px)),
      linear-gradient(158deg, transparent 40%, rgba(210, 58, 44, .14) 47%, transparent 56%),
      radial-gradient(60% 60% at 100% 0%, rgba(210, 58, 44, .38), transparent 70%),
      radial-gradient(70% 70% at 0% 100%, rgba(0, 0, 0, .7), transparent 70%),
      #121010;
  }
  .brand {
    display: inline-flex; align-items: center; font-family: "Shippori Mincho B1", serif; font-weight: 800; font-size: 120px;
    letter-spacing: .06em; line-height: 1; text-shadow: 0 4px 24px rgba(0, 0, 0, .7);
  }
  .brand .blade { position: relative; }
  .brand .blade small { font-size: .62em; letter-spacing: 0; margin: 0 .03em; }
  .brand .blade::after {
    content: ""; position: absolute; left: -.1em; right: -.5em; bottom: -.18em; height: .16em;
    background: linear-gradient(90deg, #5d6573, #c9d1dc 55%, #fff 88%, #fff);
    clip-path: polygon(0 15%, 82% 0, 100% 50%, 82% 100%, 0 85%); transform: rotate(-2deg);
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, .5));
  }
  .brand .sub { margin-left: .45em; font-size: .5em; letter-spacing: .16em; }
  .brand::after {
    content: "刀"; margin-left: .45em; width: 1.4em; height: 1.4em; display: grid; place-items: center; text-shadow: none;
    font-size: .5em; letter-spacing: 0; color: #fff; background: #d23a2c; border-radius: 4px; transform: rotate(-4deg);
  }
  .tagline {
    font-size: 40px; padding: 14px 44px 14px 36px; color: #231f1b; background: #f5efe2; letter-spacing: .06em;
    border-left: 8px solid #d23a2c; clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
  }
</style>
</head>
<body>
  <div class="brand" aria-label="KATAkaNA BUILDER"><span class="blade">KATA<small>ka</small>NA</span><span class="sub">BUILDER</span></div>
  <div class="tagline">身の回りのカタカナ語から英単語を学ぶ</div>
</body>
</html>
